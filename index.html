<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nightshift: Blackout</title><style>html,body{margin:0;overflow:hidden;background:#000;color:#fff;font-family:Tahoma,Arial,sans-serif;touch-action:none}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.64) 100%)}#top{display:flex;justify-content:space-between;padding:17px;font-size:12px;letter-spacing:.5px;text-shadow:0 2px 5px #000}.card{padding:8px 11px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.16);border-radius:7px}.red{color:#ff334c}#cross{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)}#hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:12px;color:#d3d5dd;text-shadow:0 2px 5px #000}#start,#finish{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(36,3,10,.37),#010104 68%)}#finish{display:none}h1{font-size:clamp(38px,12vw,84px);margin:0;text-shadow:0 0 34px #ef1235;letter-spacing:2px}p{max-width:420px;line-height:2;color:#c8cbd2;font-size:14px}button{font:700 17px Tahoma;padding:15px 32px;color:#fff;border:1px solid #fe4560;border-radius:8px;background:linear-gradient(135deg,#b20828,#36000b);box-shadow:0 0 30px #a70029;margin:12px;cursor:pointer}.tiny{font-size:11px;color:#898e99;line-height:1.8}</style></head><body><div id="ui"><div id="top"><div class="card" id="obj">۳ برق‌گیر باقی‌مانده</div><div class="card" id="power">نور ۱۰۰٪</div></div><div id="cross"></div><div id="hint">سمت چپ: حرکت • سمت راست: نگاه‌کردن</div></div><div id="start"><h1>BLACKOUT</h1><p>سه برق‌گیر را در آزمایشگاه زیرزمینی فعال کن. چراغ‌ها مدت‌هاست که این‌جا خاموش‌اند—اما چیزی هنوز حرکت می‌کند.</p><button id="play">وارد شو</button><span class="tiny">هدفون توصیه می‌شود • گرافیک سه‌بعدی WebGL<br>کامپیوتر: WASD و ماوس</span></div><div id="finish"><h1 id="result"></h1><p id="resultText"></p><button onclick="location.reload()">بازگشت به تاریکی</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
(()=>{const T=THREE,scene=new T.Scene(),clock=new T.Clock();scene.fog=new T.FogExp2(0x020305,.031);const cam=new T.PerspectiveCamera(67,innerWidth/innerHeight,.05,140);const r=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.2;document.body.prepend(r.domElement);const V=new T.Vector3(),up=new T.Vector3(0,1,0),player=new T.Vector3(0,1.65,18),vel=new T.Vector3(),keys={},fuses=[],walls=[];let yaw=Math.PI, pitch=0,power=100,playing=false,over=false,noise=0,headbob=0;scene.background=new T.Color(0x010203);
// Audio ambience
let AC,aGain;function beep(f,d,v=.04,type='sine'){try{AC??=new(AudioContext||webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function mat(c,rough=.75,metal=.1){return new T.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}const floorMat=mat(0x17191e,.5,.55),wallMat=mat(0x252a31,.88,.16),darkMat=mat(0x06070a,.95,.05);function box(x,y,z,sx,sy,sz,m,collide=false){let q=new T.Mesh(new T.BoxGeometry(sx,sy,sz),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;scene.add(q);if(collide)walls.push({x,z,sx,sz});return q}
// Hallway and rooms
box(0,-.14,0,12,.25,86,floorMat);box(-6,3,0,.35,6,86,wallMat,false);box(6,3,0,.35,6,86,wallMat,false);box(0,6,0,12,.2,86,darkMat);for(let z=-22;z<40;z+=5){box(-5.75,3,z,.18,6,.12,mat(0x4b5056,.45,.7));box(5.75,3,z,.18,6,.12,mat(0x4b5056,.45,.7));let rail=box(0,.035,z,11.5,.04,.09,mat(0x6e7480,.35,.8));} // cross chambers
for(const z of [-10,-30]){box(0,-.1,z,38,.24,10,floorMat);box(-18,3,z,.35,6,10,wallMat,false);box(18,3,z,.35,6,10,wallMat,false);box(0,3,z-5,.35,6,36,wallMat,false);box(0,3,z+5,.35,6,36,wallMat,false);for(let x=-16;x<=16;x+=4)box(x,5.9,z,.25,.18,9,darkMat)}
// pipes, cables, ceiling lamps
for(let z=-38;z<42;z+=8){let pipe=new T.Mesh(new T.CylinderGeometry(.12,.12,11,8),mat(0x525960,.35,.75));pipe.rotation.z=Math.PI/2;pipe.position.set(0,5.55,z);scene.add(pipe);let lamp=new T.PointLight(0xb8d7ff,1.2,11,2);lamp.position.set(0,5.35,z);scene.add(lamp);let fixture=box(0,5.55,z,1.1,.13,.32,mat(0x868f99,.35,.65));}
for(let i=0;i<42;i++){let z=38-i*1.85,x=(i%2?5.45:-5.45);let cable=new T.Mesh(new T.CylinderGeometry(.025,.025,1.2+(i%4)*.5,5),mat(0x08090b));cable.position.set(x,4.8,z);scene.add(cable)}
// props
for(let i=0;i<30;i++){let z=34-(i*7.11%72),x=(i%2?1:-1)*(3.8+(i%3));let crate=box(x,.45,z,.8+(i%3)*.3,.9,.8,mat(0x363b42,.65,.5));crate.rotation.y=i*.67}
// exit door
let door=box(0,2,-39,3.6,4,.25,mat(0x10151c,.4,.75),true);let exitLight=new T.PointLight(0xff1836,1.8,8);exitLight.position.set(0,3,-37.8);scene.add(exitLight);
function fuse(x,z){let group=new T.Group(),core=new T.Mesh(new T.BoxGeometry(.25,.7,.19),new T.MeshStandardMaterial({color:0x220007,emissive:0xff0928,emissiveIntensity:3,roughness:.3}));core.position.y=1.3;group.add(core);let glow=new T.PointLight(0xff0b28,2.4,7,2);glow.position.y=1.35;group.add(glow);let base=new T.Mesh(new T.BoxGeometry(.7,1.4,.35),mat(0x2f3740,.45,.65));base.position.y=.7;group.add(base);group.position.set(x,0,z);scene.add(group);fuses.push({group,core,glow,on:false})}fuse(0,3);fuse(-12,-10);fuse(12,-30);
// monster, deliberately low light
let monster=new T.Group();let flesh=new T.MeshStandardMaterial({color:0x020204,roughness:.9,metalness:.05});let torso=new T.Mesh(new T.CylinderGeometry(.48,.38,2.0,12),flesh);torso.position.y=1.8;monster.add(torso);let head=new T.Mesh(new T.SphereGeometry(.45,16,12),flesh);head.position.y=3.05;monster.add(head);for(let side of [-1,1]){let arm=new T.Mesh(new T.CylinderGeometry(.13,.10,1.55,8),flesh);arm.position.set(side*.62,1.8,0);arm.rotation.z=side*.36;monster.add(arm);let leg=new T.Mesh(new T.CylinderGeometry(.16,.12,1.35,8),flesh);leg.position.set(side*.25,.45,0);monster.add(leg)}let eyeMat=new T.MeshBasicMaterial({color:0xff1635});for(let side of[-1,1]){let e=new T.Mesh(new T.SphereGeometry(.055,8,6),eyeMat);e.position.set(side*.14,3.1,-.42);monster.add(e)}monster.position.set(0,0,-18);scene.add(monster);let mLight=new T.PointLight(0xff0026,.6,3);mLight.position.y=2.5;monster.add(mLight);
const flash=new T.SpotLight(0xddecff,5,42,.34,.65,1.2);flash.castShadow=true;flash.shadow.mapSize.set(1024,1024);scene.add(flash,flash.target);function collision(p){for(let a of walls)if(Math.abs(p.x-a.x)<a.sx/2+.35&&Math.abs(p.z-a.z)<a.sz/2+.35)return true;return false}function finish(win){over=true;playing=false;document.querySelector('#finish').style.display='flex';document.querySelector('#result').textContent=win?'زنده ماندی':'پیدات کرد';document.querySelector('#resultText').textContent=win?'درِ خروج باز شد. پشت سرت را نگاه نکن.':'در تاریکی، صدای نفس‌کشیدن خیلی نزدیک بود.';beep(win?740:32,win?.6:1,win?.1:.18,win?'sine':'sawtooth')}
function resize(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let dragging=false,lastX,lastY,stick={x:0,y:0};addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;if(e.clientX<innerWidth*.48){stick.x=e.clientX;stick.y=e.clientY}});addEventListener('pointermove',e=>{if(!dragging)return;if(lastX<innerWidth*.48){keys._touchX=(e.clientX-stick.x)/70;keys._touchZ=(e.clientY-stick.y)/70}else{yaw-=(e.clientX-lastX)*.006;pitch=Math.max(-.65,Math.min(.65,pitch-(e.clientY-lastY)*.004))}lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>{dragging=false;keys._touchX=keys._touchZ=0});document.querySelector('#play').onclick=()=>{document.querySelector('#start').style.display='none';playing=true;clock.start();beep(110,.25,.07);};
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(playing&&!over){power=Math.max(0,power-dt*.36);let sx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+(keys._touchX||0),sz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+(keys._touchZ||0);let L=Math.hypot(sx,sz);if(L>1){sx/=L;sz/=L}let speed=dt*4.1;V.set(sx*speed,0,sz*speed).applyAxisAngle(up,yaw);let next=player.clone().add(V);if(!collision(next))player.copy(next);headbob+=L*dt*9;cam.position.copy(player);cam.position.y+=Math.sin(headbob)*.035;cam.rotation.set(pitch,yaw,0,'YXZ');flash.position.copy(cam.position);let dir=new T.Vector3(0,0,-1).applyEuler(cam.rotation);flash.target.position.copy(cam.position).add(dir);flash.intensity=(power>0?5.2:0)+Math.sin(performance.now()*.018)*.18;flash.distance=power>0?38:0;
// chase when player finishes first fuse
let active=fuses.filter(f=>!f.on).length;let target=player.clone();target.y=0;let md=monster.position.distanceTo(target);if(active<3){let ms=dt*(active===0?.88:.53);monster.position.lerp(target,Math.min(1,ms/md));monster.lookAt(player.x,1.7,player.z);monster.rotation.y+=Math.PI;monster.position.y=Math.sin(performance.now()*.005)*.035;if(md<1.25){finish(false)}}for(let f of fuses)if(!f.on&&f.group.position.distanceTo(player)<1.4){f.on=true;f.core.material.emissive.setHex(0x16ff8f);f.core.material.emissiveIntensity=3;f.glow.color.setHex(0x11ff8a);power=Math.min(100,power+32);beep(640,.18,.12,'square')}if(active===0&&player.distanceTo(new T.Vector3(0,1.65,-35.7))<3)finish(true);document.querySelector('#obj').textContent=active===0?'برو سمت خروجی':active+' برق‌گیر باقی‌مانده';document.querySelector('#power').textContent='نور '+Math.ceil(power)+'٪';noise=power<20?1:0}
